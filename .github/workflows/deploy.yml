name: build & deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Nécessaire à `configure-pages` pour activer Pages sur le dépôt.
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Bascule la source de Pages sur GitHub Actions si ce n'est pas déjà
      # fait. Sans ça, une source « deploy from a branch » continue de servir
      # l'ancien contenu et écrase silencieusement les déploiements de ce
      # workflow — le job réussit, mais le site ne change pas.
      - name: Activer GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      # Le chemin de base suit le nom du dépôt : GitHub Pages sert le site
      # depuis /<nom-du-depot>/. Renommer le dépôt suffit donc, sans toucher
      # au code — il faut simplement relancer ce workflow ensuite.
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    # Pas de publication depuis une pull request : seul `main` va en ligne.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
