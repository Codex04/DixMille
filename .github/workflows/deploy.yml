name: build & deploy

# Contrairement à l'ancien workflow (`on: [push]`, qui publiait en
# production depuis n'importe quelle branche), rien n'est déployé
# automatiquement : la vérification tourne à chaque push, la publication
# reste un geste manuel.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Nécessite package-lock.json committé : il est généré au premier
      # `npm install` en local.
      - run: npm ci

      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    # Publication uniquement sur déclenchement manuel, le temps de valider
    # la bascule depuis la version Blazor.
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
